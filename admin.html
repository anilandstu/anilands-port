<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANILANDS — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar"><a class="wordmark" href="index.html">ANILANDS</a><button id="adminLogout" class="outline-btn">Đăng xuất</button></header>
  <main class="dashboard admin-dashboard">
    <p class="eyebrow">CONTROL PANEL</p>
    <h1>Quản lý Artist</h1>
    <div class="admin-toolbar">
      <input id="searchInput" placeholder="Tìm tên Artist, UUID hoặc Gmail">
      <button id="refreshBtn" class="outline-btn">Làm mới</button>
    </div>
    <p id="adminNotice" class="notice"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>UUID</th><th>Artist</th><th>Gmail</th><th>Facebook</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody id="userRows"><tr><td colspan="6">Đang tải...</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
